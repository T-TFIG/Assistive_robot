controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    omni_base_controller:
      type: omni_pid_controller/PidController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # external sensor interface zone 
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    # the estimator part
    pure_encoder_estimator:
      type: robot_estimators/PureEncoder
    ekf_estimator:
      type: robot_estimators/EkfEstimator

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # Updated to include ALL joints so Rviz shows the arm moving
    joints:
      - mobile_base_Revolute_1
      - mobile_base_Revolute_2
      - mobile_base_Revolute_3
      - mobile_base_Revolute_4
      - ur5_shoulder_pan_joint
      - ur5_shoulder_lift_joint
      - ur5_elbow_joint
      - ur5_wrist_1_joint
      - ur5_wrist_2_joint
      - ur5_wrist_3_joint

omni_base_controller:
  ros__parameters:
    use_sim_time: true
    header_frame: "odom"
    child_frame: "base_link"
    num_of_wheels: 4  #1.116
    robot_length: 0.217
    robot_width: 0.211   # Increased from 0.195 0.14
    wheel_radius: 0.02525 #55 #52
    dof_names:
      - mobile_base_Revolute_1
      - mobile_base_Revolute_2
      - mobile_base_Revolute_3
      - mobile_base_Revolute_4
    command_interface: effort        
    state_interfaces:
      - velocity
    i_min: -15.0
    i_max: 15.0
    wheel_1: {kp: 0.02, ki: 0.02, kd: 0.0}
    wheel_2: {kp: 0.02, ki: 0.02, kd: 0.0}
    wheel_3: {kp: 0.02, ki: 0.02, kd: 0.0}
    wheel_4: {kp: 0.02, ki: 0.02, kd: 0.0}
    init_odom_vel:
      X: 0.0
      Y: 0.0
      Yaw: 0.0

# ADD THIS BLOCK: Settings for the UR5 arm
imu_sensor_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_sensor
    frame_id: imu_link

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - ur5_shoulder_pan_joint
      - ur5_shoulder_lift_joint
      - ur5_elbow_joint
      - ur5_wrist_1_joint
      - ur5_wrist_2_joint
      - ur5_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # These help Gazebo stay stable during movement
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

pure_encoder_estimator:
  ros__parameters:
    use_sim_time: true
    pure_encoder:
      robot_dimensions:
        wheel_radius: 0.02525
        robot_length: 0.217
        robot_width: 0.211
      odom_topic:    "/odom"
      odom_frame_id: "odom"
      base_frame_id: "base_footprint"

ekf_estimator:
  ros__parameters:
    use_sim_time: true
    ekf_estimator:
      robot_dimensions:
        wheel_radius: 0.02525
        robot_length: 0.217
        robot_width: 0.211
      ekf_tuning:
        process_noise_theta: 0.02
        measurement_noise_gyro: 0.0001
      odom_topic:    "/odom/ekf"
      odom_frame_id: "odom_ekf"
      base_frame_id: "base_footprint_ekf"
